  <script>if ("serviceWorker" in navigator) addEventListener("load", () => navigator.serviceWorker.register("sw.js").catch(() => {}));</script>
</head>
<body>
<style>
/* Téléphone tourné à l'horizontale : l'appli est prévue en portrait (l'iPhone ne permet pas de bloquer la rotation d'une appli web) */
#portrait{display:none}
@media (orientation:landscape) and (max-height:500px){
  #portrait{display:flex;position:fixed;inset:0;z-index:2147483000;background:#1C433B;color:#fff;flex-direction:column;align-items:center;justify-content:center;gap:12px;text-align:center;padding:20px;font-family:'Nunito',system-ui,sans-serif}
  #portrait .ic{font-size:64px;animation:pt-tourne 2s ease-in-out infinite}
  #portrait b{font-size:22px}
  #portrait span{font-size:14px;opacity:.85}
  body{overflow:hidden}
}
@keyframes pt-tourne{0%,30%{transform:rotate(-90deg)}60%,100%{transform:rotate(0)}}
</style>
<div id="portrait" role="alert"><div class="ic">📱</div><b>Tournez votre téléphone</b><span>L'appli s'utilise à la verticale.</span></div>


<!-- ═══ Ouverture animée « Le verger au lever du jour » (s'affiche tout de suite, pendant que l'appli se charge) ═══ -->
<style>
html.ouv{background:#0D2721}
#ouverture{position:fixed;inset:0;z-index:2147482000;overflow:hidden;font-family:'Nunito',system-ui,sans-serif;-webkit-tap-highlight-color:transparent;
  background:linear-gradient(#0D2721 0%,#1C433B 45%,#3F7A5C 72%,#E8C77A 100%);transition:opacity .6s ease,transform .6s ease}
#ouverture.fin{opacity:0;transform:scale(1.04)}
#ouverture .ov-soleil{position:absolute;left:50%;bottom:-30vw;width:120vw;height:120vw;margin-left:-60vw;border-radius:50%;
  background:radial-gradient(circle,rgba(255,236,170,.95) 0%,rgba(246,212,122,.55) 25%,rgba(246,212,122,0) 60%);transform:translateY(30%);opacity:0;animation:ovLeve 3s ease .1s forwards}
#ouverture .ov-colline{position:absolute;left:-10%;right:-10%;bottom:0;transform:translateY(100%)}
#ouverture .ov-colline svg{display:block;width:100%;height:auto}
#ouverture .ov-c1{animation:ovMonte 1.6s cubic-bezier(.2,.8,.2,1) .2s forwards}
#ouverture .ov-c2{animation:ovMonte 1.6s cubic-bezier(.2,.8,.2,1) .35s forwards}
#ouverture .ov-c3{animation:ovMonte 1.6s cubic-bezier(.2,.8,.2,1) .5s forwards}
#ouverture .ov-pomme{position:absolute;left:50%;top:-60px;width:44px;height:44px;margin-left:-22px;opacity:0;animation:ovTombe .8s cubic-bezier(.55,0,1,.45) 1.1s forwards}
#ouverture .ov-pomme svg{width:100%;height:100%;filter:drop-shadow(0 0 10px rgba(255,220,120,.8))}
#ouverture .ov-onde{position:absolute;left:50%;top:51%;width:60px;height:22px;margin:-11px 0 0 -30px;border:2px solid rgba(255,243,196,.9);border-radius:50%;opacity:0;animation:ovOnde .9s ease-out 1.92s forwards}
#ouverture .ov-logo{position:absolute;left:50%;top:44%;width:min(66vw,280px);transform:translate(-50%,-50%) scale(.2);opacity:0;animation:ovLogo .9s cubic-bezier(.25,1.5,.45,1) 1.9s forwards}
#ouverture .ov-logo img{display:block;width:100%;filter:drop-shadow(0 14px 20px rgba(0,0,0,.35))}
#ouverture .ov-txt{position:absolute;left:0;right:0;top:66%;text-align:center}
#ouverture .ov-slogan{font-family:'Sacramento',cursive;font-size:clamp(32px,9.4vw,42px);line-height:1.05;color:#FFF6DA;text-shadow:0 2px 12px rgba(0,0,0,.35);opacity:0;filter:blur(8px);animation:ovNet 1s ease 2.4s forwards}
#ouverture .ov-lieu{margin-top:12px;font-size:10.5px;font-weight:800;letter-spacing:.4em;color:#1C433B;opacity:0;animation:ovFade .7s ease 2.8s forwards}
#ouverture .ov-luc{position:absolute;width:4px;height:4px;border-radius:50%;background:#FFF3C4;box-shadow:0 0 10px 2px rgba(255,236,170,.8);opacity:0;animation:ovLuciole 3.5s ease-in-out infinite}
@keyframes ovLeve{to{opacity:1;transform:translateY(0)}}
@keyframes ovMonte{to{transform:translateY(0)}}
@keyframes ovTombe{0%{opacity:1;transform:translateY(0) rotate(-40deg)}100%{opacity:1;transform:translateY(calc(51vh + 60px - 22px)) rotate(200deg)}}
@keyframes ovOnde{0%{opacity:1;transform:scale(.4)}100%{opacity:0;transform:scale(5)}}
@keyframes ovLogo{to{opacity:1;transform:translate(-50%,-50%) scale(1)}}
@keyframes ovNet{to{opacity:1;filter:blur(0)}}
@keyframes ovFade{to{opacity:1}}
@keyframes ovLuciole{0%,100%{opacity:0;transform:translate(0,0)}50%{opacity:1;transform:translate(var(--x),-24px)}}
@media (prefers-reduced-motion:reduce){#ouverture *{animation-duration:.01s!important;animation-delay:0s!important;animation-iteration-count:1!important}#ouverture .ov-luc,#ouverture .ov-pomme,#ouverture .ov-onde{display:none}}
</style>
<div id="ouverture" aria-label="Épicerie Raddonnaise">
  <div class="ov-soleil"></div>
  <div class="ov-colline ov-c1"><svg viewBox="0 0 400 140" preserveAspectRatio="none"><path d="M0 70 C80 20 160 40 220 60 S340 30 400 50 V140 H0z" fill="#2E6A4A"/></svg></div>
  <div class="ov-colline ov-c2"><svg viewBox="0 0 400 120" preserveAspectRatio="none"><path d="M0 60 C90 90 170 30 260 50 S360 80 400 40 V120 H0z" fill="#245A3E"/></svg></div>
  <div class="ov-colline ov-c3"><svg viewBox="0 0 400 100" preserveAspectRatio="none"><path d="M0 50 C100 20 200 70 300 40 S380 30 400 45 V100 H0z" fill="#1A4530"/></svg></div>
  <div class="ov-pomme"><svg viewBox="0 0 44 44"><defs><radialGradient id="ovPg" cx=".35" cy=".35" r=".8"><stop offset="0" stop-color="#F3F7B0"/><stop offset=".45" stop-color="#A9C75A"/><stop offset="1" stop-color="#5E8A2C"/></radialGradient></defs>
    <path d="M22 12c-6-5-17-2-17 10 0 9 7 18 12 18 2 0 3-1 5-1s3 1 5 1c5 0 12-9 12-18 0-12-11-15-17-10z" fill="url(#ovPg)"/><path d="M22 12c0-4 1-7 3-9" stroke="#3B2A1E" stroke-width="2.4" fill="none" stroke-linecap="round"/></svg></div>
  <div class="ov-onde"></div>
  <div class="ov-logo"><img src="logo-intro.png" alt="Épicerie Raddonnaise"></div>
  <div class="ov-txt"><div class="ov-slogan">Votre épicerie,<br>tout près de chez vous</div><div class="ov-lieu">RADDON-ET-CHAPENDU</div></div>
</div>
<script>
  // Ouverture : au moins 3,6 s (ou un toucher), et jamais avant que l'appli soit prête derrière ; ensuite elle s'efface sur l'écran du thème
  (function () {
    var o = document.getElementById("ouverture"), reduit = matchMedia("(prefers-reduced-motion: reduce)").matches;
    document.documentElement.classList.add("ouv");
    for (var i = 0; i < 14; i++) {   // lucioles
      var e = document.createElement("i"); e.className = "ov-luc";
      e.style.cssText = "left:" + (5 + Math.random() * 90) + "%;top:" + (35 + Math.random() * 45) + "%;--x:" + (Math.random() * 40 - 20) + "px;animation-delay:" + (1 + Math.random() * 2.5) + "s";
      o.appendChild(e);
    }
    var t0 = Date.now(), min = reduit ? 500 : 3600, pret = false, touche = false, fini = false;
    function essayer() {
      if (fini || !pret || (!touche && Date.now() - t0 < min)) return;
      fini = true; o.classList.add("fin"); o.style.pointerEvents = "none";
      window.__ouvFinie = true; dispatchEvent(new Event("ouverture-fin"));   // l'écran du thème démarre pendant que l'ouverture s'efface
      setTimeout(function () { o.remove(); document.documentElement.classList.remove("ouv"); }, 750);
    }
    window.__appPret = function () { pret = true; essayer(); };
    o.addEventListener("click", function () { touche = true; essayer(); });
    setTimeout(essayer, min + 20);
    setTimeout(function () { pret = true; essayer(); }, 9000);   // filet de sécurité : l'ouverture ne bloque jamais l'appli
  })();
</script>
  <div id="root"></div>
  <noscript>Activez JavaScript pour utiliser l'application.</noscript>
  <script>
    // Filet de sécurité : si l'appli ne s'affiche pas (mise à jour coupée, réseau…), on propose de recharger
    (function () {
      function secours() {
        var r = document.getElementById("root"); if (!r || r.childElementCount) return;
        window.__appPret && window.__appPret();   // l'ouverture animée laisse la place au bouton « Recharger »
        r.innerHTML = '<div style="font-family:system-ui,sans-serif;text-align:center;padding:60px 24px;color:#1C433B">'
          + '<div style="font-size:19px;font-weight:800;margin-bottom:8px">Chargement…</div>'
          + '<div style="font-size:14px;color:#5C6A62;margin-bottom:20px">L\'application met un peu de temps à démarrer.</div>'
          + '<button onclick="location.reload()" style="border:none;background:#1C433B;color:#fff;font-size:16px;font-weight:800;padding:14px 26px;border-radius:12px">Recharger</button></div>';
      }
      window.__secours = secours;
      setTimeout(secours, 7000);
    })();
  </script>
  <script type="module" src="client.js?v=2.23" onerror="window.__secours && window.__secours()"></script>
</body>
</html>
