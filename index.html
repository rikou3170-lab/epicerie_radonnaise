<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#1C433B">
  <meta name="description" content="L'application de l'Épicerie Raddonnaise : le frais du jour, les plateaux et paniers, votre carte de fidélité.">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icon-192.png">
  <link rel="apple-touch-icon" href="icon-180.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Épicerie">
  <link rel="preload" href="fonts/sacramento-latin-400-normal.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="fonts/nunito-latin-400-normal.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="fonts.css">
  <link rel="preload" href="logo-intro.png" as="image">
  <title>Épicerie Raddonnaise</title>
  <style>html,body{margin:0;background:#F7F3EA;max-width:100%;overflow-x:hidden;overflow-x:clip;-webkit-text-size-adjust:100%;text-size-adjust:100%}</style>
  <script>if ("serviceWorker" in navigator) addEventListener("load", () => navigator.serviceWorker.register("sw.js").catch(() => {}));</script>
</head>
<body>
  <div id="root"></div>
  <noscript>Activez JavaScript pour utiliser l'application.</noscript>
  <script>
    // Filet de sécurité : si l'appli ne s'affiche pas (mise à jour coupée, réseau…), on propose de recharger
    (function () {
      function secours() {
        var r = document.getElementById("root"); if (!r || r.childElementCount) return;
        r.innerHTML = '<div style="font-family:system-ui,sans-serif;text-align:center;padding:60px 24px;color:#1C433B">'
          + '<div style="font-size:19px;font-weight:800;margin-bottom:8px">Chargement…</div>'
          + '<div style="font-size:14px;color:#5C6A62;margin-bottom:20px">L\'application met un peu de temps à démarrer.</div>'
          + '<button onclick="location.reload()" style="border:none;background:#1C433B;color:#fff;font-size:16px;font-weight:800;padding:14px 26px;border-radius:12px">Recharger</button></div>';
      }
      window.__secours = secours;
      setTimeout(secours, 7000);
    })();
  </script>
  <script type="module" src="client.js?v=1.56" onerror="window.__secours && window.__secours()"></script>
</body>
</html>
