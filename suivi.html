<!doctype html>
<html lang="fr"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Suivi du lancement — Épicerie Raddonnaise</title>
<meta name="robots" content="noindex,nofollow">
<link rel="manifest" href="suivi.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Suivi">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#1C433B">
<link rel="stylesheet" href="fonts.css">
<style>
:root{--forest:#1C433B;--apple:#7FB24A;--gold:#E9B949;--bg:#F5F2EA;--card:#fff;--ink:#1E2A26;--ink2:#5A6A62;--ink3:#93A099;--line:#E5E0D4}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:'Nunito',system-ui,sans-serif}
.top{background:var(--forest);color:#fff;padding:calc(18px + env(safe-area-inset-top)) calc(16px + env(safe-area-inset-right)) 16px calc(16px + env(safe-area-inset-left));position:sticky;top:0;z-index:5;box-shadow:0 2px 10px rgba(0,0,0,.15)}
.top .t{font-family:'Sacramento',cursive;font-size:34px;line-height:1;color:var(--gold)}
.top .s{font-size:12px;letter-spacing:.14em;text-transform:uppercase;opacity:.8;margin-top:4px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.live{display:inline-flex;align-items:center;gap:6px;background:rgba(255,255,255,.12);padding:2px 9px;border-radius:12px;letter-spacing:.06em}
.live i{width:7px;height:7px;border-radius:50%;background:#7CFC9A;animation:clign 1.6s infinite}
@keyframes clign{50%{opacity:.25}}
.live[hidden]{display:none}
.wrap{max-width:1200px;margin:0 auto;padding:16px}
.seg{display:flex;gap:6px;background:#E9E4D8;padding:4px;border-radius:12px;margin:0 0 14px}
.seg button{flex:1;border:none;background:transparent;padding:9px 6px;border-radius:9px;font:inherit;font-weight:800;font-size:13px;color:var(--ink2);cursor:pointer}
.seg button.on{background:#fff;color:var(--forest);box-shadow:0 1px 4px rgba(0,0,0,.08)}
.kpis{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px;margin-bottom:14px}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px}
.kpi .v{font-size:30px;font-weight:800;color:var(--forest);line-height:1.1}
.kpi .l{font-size:12.5px;font-weight:700;color:var(--ink2);margin-top:4px}
.kpi .d{font-size:11.5px;color:var(--ink3);margin-top:3px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:12px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;min-width:0}
.card h3{margin:0 0 4px;font-size:15px;color:var(--forest)}
.card .sub{font-size:12px;color:var(--ink3);margin-bottom:12px}
.barre{display:grid;grid-template-columns:minmax(110px,50%) 1fr 40px;align-items:center;gap:8px;margin:7px 0;font-size:13px}
.barre .n{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.barre .b{height:12px;border-radius:6px;background:#EEF2E6;overflow:hidden}
.barre .b i{display:block;height:100%;border-radius:6px;background:linear-gradient(90deg,var(--apple),#5E9A3E)}
.barre .c{text-align:right;font-weight:800;color:var(--forest)}
.vide{font-size:13px;color:var(--ink3);padding:8px 0}
.jours{display:flex;align-items:flex-end;justify-content:center;gap:6px;height:170px;padding-top:4px;overflow-x:auto}
.jours .col{flex:1;min-width:30px;max-width:70px;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;gap:4px}
.jours .col i{display:block;flex:1;border-radius:6px 6px 2px 2px;background:linear-gradient(180deg,var(--gold),#C9972C);min-height:2px}
.jours .col i.o{background:linear-gradient(180deg,#9CC0A8,#5E8A70)}
.jours .col span{font-size:10px;color:var(--ink3);white-space:nowrap}
.jours .col b{font-size:11px;color:#8A6410;line-height:1.1}.jours .col b.o{color:#3F6E55}
.leg{display:flex;gap:14px;font-size:12px;color:var(--ink2);margin-top:8px}
.leg i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px}
.heures{display:grid;grid-template-columns:repeat(24,minmax(0,1fr));gap:2px;align-items:end;height:120px;padding-bottom:16px}
.heures div{display:flex;flex-direction:column;justify-content:flex-end;align-items:center;height:100%;position:relative;min-width:0}
.heures i{display:block;width:100%;border-radius:3px;background:var(--apple)}.heures i.z{background:none}
.heures span{position:absolute;bottom:-15px;left:0;font-size:9px;color:var(--ink3);white-space:nowrap}
.login{max-width:380px;margin:60px auto;background:#fff;border:1px solid var(--line);border-radius:18px;padding:24px}
.login h2{margin:0 0 6px;color:var(--forest)}
.login p{font-size:13px;color:var(--ink2);margin:0 0 16px;line-height:1.45}
.inp{width:100%;padding:12px 14px;border:1.5px solid var(--line);border-radius:12px;font:inherit;font-size:15px;margin-bottom:10px;background:#FCFBF7}
.btn{width:100%;padding:13px;border:none;border-radius:12px;background:var(--forest);color:#fff;font:inherit;font-weight:800;font-size:15px;cursor:pointer}
.btn.gh{background:transparent;color:var(--forest);border:1.5px solid var(--line);width:auto;padding:8px 14px;font-size:13px}
.err{color:#B3261E;font-size:13px;margin:4px 0 10px;min-height:18px}
.note{font-size:12px;color:var(--ink3);line-height:1.5;margin:18px 4px 30px}
.tech{margin-top:16px}
.tech h2{font-size:13px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink2);margin:6px 4px 10px}
.tab{width:100%;border-collapse:collapse;font-size:12.5px}
.tab td,.tab th{padding:6px 4px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
.tab th{font-size:11px;color:var(--ink3);font-weight:700;text-transform:uppercase;letter-spacing:.05em}
.tab td.r,.tab th.r{text-align:right;font-weight:800;color:var(--forest)}
.mono{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:12px}
.ok{color:#2E7D32;font-weight:800}.ko{color:#B3261E;font-weight:800}
.defil{max-height:260px;overflow:auto}
.rech{width:100%;padding:10px 12px;border:1.5px solid var(--line);border-radius:10px;font:inherit;font-size:14px;margin-bottom:8px;background:#FCFBF7}
.neuf{display:inline-block;background:#FFF3D1;color:#8A6410;font-size:10.5px;font-weight:800;padding:1px 6px;border-radius:6px;margin-left:4px}
.tab a{color:var(--forest)}
.pied{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-top:14px}
</style></head>
<body>
<div class="top"><div class="t">Suivi du lancement</div><div class="s">Épicerie Raddonnaise · Suivi v1.2 <span class="live" id="live" hidden><i></i>en direct</span><span id="maj"></span></div></div>
<div class="wrap" id="app"><div class="vide">Chargement…</div></div>

<script type="module">
// ── Suivi du lancement : lecture seule, réservée au compte administrateur (règles Firebase) ──
// Rien n'est écrit dans la base. Les consultations sont des compteurs anonymes (jamais liés à une personne).
const DEMO = new URLSearchParams(location.search).has("demo");   // aperçu avec des données fictives (sans connexion)
const LANCEMENT = "2026-11-06";
const PC = matchMedia("(min-width:900px) and (hover:hover)").matches;   // la liste nominative n'est téléchargée que sur ordinateur ; sur téléphone, seulement des nombres
const RUB = { accueil: "Accueil", carte: "La carte", fidelite: "Fidélité", actus: "Actus", infos: "Infos" };
const AUTRES = { commandes: "Commandes passées", reservations: "Bons plans réservés", chat: "Messages envoyés", avis: "Avis / sondages" };
const $ = (s) => document.querySelector(s);
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const iso = (d) => d.toLocaleDateString("sv-SE");
const auj = () => iso(new Date());
const plus = (j, n) => { const d = new Date(j + "T12:00"); d.setDate(d.getDate() + n); return iso(d); };
const court = (j) => new Date(j + "T12:00").toLocaleDateString("fr-FR", { weekday: "short", day: "numeric" });
const dateDe = (v) => { if (!v) return null; if (typeof v === "number") return iso(new Date(v)); if (v.toDate) return iso(v.toDate()); const s = String(v); return /^\d{4}-\d{2}-\d{2}/.test(s) ? s.slice(0, 10) : (isNaN(Date.parse(s)) ? null : iso(new Date(s))); };

let periode = "lancement", recherche = "";   // aujourdhui | 7j | lancement
const D = { stats: [], clients: [], commandes: [], appareils: [], plateaux: {}, offres: {}, producteurs: {}, pret: false, nbClients: null, nbClientsPeriode: null };
const T = { version: "?", compte: "", lectures: 0, docs: {}, dernier: null, erreurs: [], connexions: [], debut: Date.now() };
const hm = (t) => t ? new Date(t).toLocaleString("fr-FR", { day: "2-digit", month: "2-digit", hour: "2-digit", minute: "2-digit" }) : "—";
fetch("version.json?t=" + Date.now()).then(r => r.json()).then(v => { T.version = v.version || "?"; rendu(); }).catch(() => { });

function bornes() {
  const a = auj();
  if (periode === "aujourdhui") return [a, a];
  if (periode === "7j") return [plus(a, -6), a];
  return [LANCEMENT < a ? LANCEMENT : a, a];
}
const dans = (j, [du, au]) => j && j >= du && j <= au;

function barres(lignes, vide) {
  const l = lignes.filter(x => x[1] > 0).sort((a, b) => b[1] - a[1]);
  if (!l.length) return `<div class="vide">${vide}</div>`;
  const max = l[0][1];
  return l.map(([n, v]) => `<div class="barre"><div class="n" title="${esc(n)}">${esc(n)}</div><div class="b"><i style="width:${Math.max(3, 100 * v / max)}%"></i></div><div class="c">${v}</div></div>`).join("");
}

function rendu() {
  if (!D.pret) return;
  const focusRech = document.activeElement?.id === "rech";
  const b = bornes(), a = auj();
  const st = D.stats.filter(s => dans(s.jour, b));
  const somme = (pred) => st.filter(pred).reduce((m, s) => m + (s.n || 0), 0);
  const parCle = (prefixe) => { const m = {}; st.filter(s => s.cle.startsWith(prefixe)).forEach(s => { const k = s.cle.slice(prefixe.length); m[k] = (m[k] || 0) + (s.n || 0); }); return m; };
  const visiteurs = somme(s => s.cle === "visiteurs"), ouvertures = somme(s => s.cle === "ouvertures");
  const cartes = PC ? D.clients.filter(c => dans(dateDe(c.depuis), b)).length : (D.nbClientsPeriode ?? "…");
  const totalClients = PC ? D.clients.length : (D.nbClients ?? "…");
  const cmds = D.commandes.filter(c => dans(dateDe(c.cree), b)).length;
  const visitAuj = D.stats.filter(s => s.jour === a && s.cle === "visiteurs").reduce((m, s) => m + s.n, 0);
  // jour par jour
  const [du, au] = b, jours = []; for (let j = du; j <= au; j = plus(j, 1)) jours.push(j);
  const parJour = (cle) => Object.fromEntries(jours.map(j => [j, D.stats.filter(s => s.jour === j && s.cle === cle).reduce((m, s) => m + s.n, 0)]));
  const vj = parJour("visiteurs"), oj = parJour("ouvertures"), mx = Math.max(1, ...jours.map(j => Math.max(vj[j], oj[j])));
  const h = parCle("h_"), hmax = Math.max(1, ...Object.values(h));
  const rub = parCle("v_"), pl = parCle("pl_"), pr = parCle("prod_"), rs = parCle("resa_");
  const libelle = (p) => p === "aujourdhui" ? "aujourd'hui" : p === "7j" ? "sur 7 jours" : "depuis le lancement";

  $("#app").innerHTML = `
    <div class="seg">${[["aujourdhui", "Aujourd'hui"], ["7j", "7 jours"], ["lancement", "Depuis le lancement"]].map(([k, t]) => `<button data-p="${k}" class="${periode === k ? "on" : ""}">${t}</button>`).join("")}</div>
    <div class="kpis">
      <div class="kpi"><div class="v">${visiteurs}</div><div class="l">Visiteurs</div><div class="d">${libelle(periode)} · téléphones différents chaque jour</div></div>
      <div class="kpi"><div class="v">${ouvertures}</div><div class="l">Ouvertures de l'appli</div><div class="d">${visiteurs ? (ouvertures / visiteurs).toFixed(1).replace(".", ",") + " par visiteur" : "—"}</div></div>
      <div class="kpi"><div class="v">${cartes}</div><div class="l">Cartes de fidélité créées</div><div class="d">${totalClients} au total</div></div>
      <div class="kpi"><div class="v">${D.appareils.length}</div><div class="l">Téléphones avec alertes</div><div class="d">notifications activées (total)</div></div>
      <div class="kpi"><div class="v">${cmds}</div><div class="l">Commandes</div><div class="d">${libelle(periode)}</div></div>
      <div class="kpi"><div class="v">${visitAuj}</div><div class="l">Visiteurs aujourd'hui</div><div class="d">mis à jour en direct</div></div>
    </div>
    <div class="grid">
      <div class="card" style="grid-column:1/-1"><h3>Jour par jour</h3><div class="sub">Visiteurs (or) et ouvertures (vert)</div>
        <div class="jours">${jours.map(j => `<div class="col"><b>${vj[j] || ""}</b><b class="o">${oj[j] || ""}</b><div style="display:flex;gap:3px;align-items:flex-end;width:100%;height:100%"><i style="height:${100 * vj[j] / mx}%"></i><i class="o" style="height:${100 * oj[j] / mx}%"></i></div><span>${court(j)}</span></div>`).join("")}</div></div>
      <div class="card"><h3>Rubriques consultées</h3><div class="sub">Nombre d'affichages de chaque onglet</div>${barres(Object.entries(rub).map(([k, v]) => [RUB[k] || k, v]), "Pas encore de consultation sur cette période.")}</div>
      <div class="card"><h3>Heures d'affluence</h3><div class="sub">Ouvertures de l'appli selon l'heure</div>
        <div class="heures">${Array.from({ length: 24 }, (_, i) => { const k = String(i).padStart(2, "0"), v = h[k] || 0; return `<div title="${i} h : ${v}"><i class="${v ? "" : "z"}" style="height:${100 * v / hmax}%"></i><span>${i % 3 === 0 ? i + "h" : ""}</span></div>`; }).join("")}</div></div>
      <div class="card"><h3>Plateaux regardés</h3><div class="sub">Fiches plateaux / paniers ouvertes</div>${barres(Object.entries(pl).map(([k, v]) => [D.plateaux[k] || D.offres[k] || "Fiche " + k.slice(0, 8), v]), "Aucun plateau consulté sur cette période.")}</div>
      <div class="card"><h3>Producteurs consultés</h3><div class="sub">Fiches producteurs ouvertes</div>${barres(Object.entries(pr).map(([k, v]) => [D.producteurs[k] || "Producteur " + k.slice(0, 8), v]), "Aucune fiche producteur ouverte sur cette période.")}</div>
      <div class="card"><h3>Actions des clients</h3><div class="sub">Ce que les clients ont fait dans l'appli</div>${barres(Object.entries(AUTRES).map(([k, t]) => [t, somme(s => s.cle === k)]), "Aucune action sur cette période.")}</div>
    </div>
    ${comptes(b)}
    ${tech(b, st)}
    <div class="pied"><span class="note" style="margin:0">Données anonymes : l'appli compte les consultations sans jamais savoir qui les fait.</span>${DEMO ? "" : '<button class="btn gh" id="sortir">Se déconnecter</button>'}</div>
    <div class="note">« Visiteurs » = nombre de téléphones différents ayant ouvert l'appli chaque jour (additionnés sur la période). Les cartes et commandes viennent directement de la base de l'épicerie.${DEMO ? " <b>Aperçu avec des données fictives.</b>" : ""}</div>`;
  const rc = $("#rech"); if (rc) { rc.oninput = () => { recherche = rc.value; $("#tclients").innerHTML = lignesClients(bornes()); }; if (focusRech) { rc.focus(); rc.setSelectionRange(rc.value.length, rc.value.length); } }
  document.querySelectorAll(".seg button").forEach(x => x.onclick = () => { periode = x.dataset.p; rendu(); if (!PC) window.__compter?.(); });
  const so = $("#sortir"); if (so) so.onclick = () => window.__sortir?.();
  $("#maj").textContent = "· " + new Date().toLocaleTimeString("fr-FR", { hour: "2-digit", minute: "2-digit" });
}

function tech(b, st) {
  const maintenant = Date.now(), J = 864e5;
  const ap = D.appareils, actifs7 = ap.filter(x => x.maj && maintenant - x.maj < 7 * J).length, majAuj = ap.filter(x => x.maj && dateDe(x.maj) === auj()).length;
  const promo = ap.filter(x => x.promo).length, refsMoy = ap.length ? (ap.reduce((m, x) => m + (x.refs || 0), 0) / ap.length).toFixed(1).replace(".", ",") : "—";
  const brut = {}; st.forEach(s => brut[s.cle] = (brut[s.cle] || 0) + (s.n || 0));
  const lignesBrut = Object.entries(brut).sort((a, b) => a[0].localeCompare(b[0]));
  const parApp = {}; T.connexions.forEach(c => parApp[c.app || "?"] = (parApp[c.app || "?"] || 0) + 1);
  const dureeMin = Math.round((maintenant - T.debut) / 6e4);
  const ligne = (n, v) => `<tr><td>${n}</td><td class="r">${v}</td></tr>`;
  return `<div class="tech"><h2>Données techniques</h2><div class="grid">
    <div class="card"><h3>État</h3><div class="sub">Application et connexion à la base</div><table class="tab">
      ${ligne("Version des applis", "v" + esc(T.version))}${ligne("Version du suivi", "v1.2")}
      ${ligne("Base Firebase", DEMO ? "aperçu" : (T.dernier && maintenant - T.dernier < 5 * 6e4 ? '<span class="ok">en direct</span>' : T.dernier ? "dernière donnée " + hm(T.dernier) : '<span class="ko">pas de données</span>'))}
      ${ligne("Compte connecté", esc(T.compte || "—"))}
      ${ligne("Documents lus (cette page)", T.lectures + ` <span style="font-weight:400;color:var(--ink3)">en ${dureeMin} min</span>`)}
      ${Object.entries(T.docs).map(([k, v]) => ligne("· " + esc(k), v)).join("")}
      ${ligne("Erreurs", T.erreurs.length ? '<span class="ko">' + T.erreurs.length + "</span>" : '<span class="ok">aucune</span>')}
    </table>${T.erreurs.length ? `<div class="mono" style="margin-top:8px;color:#B3261E">${T.erreurs.slice(-5).map(esc).join("<br>")}</div>` : ""}
    <div class="sub" style="margin:8px 0 0">Quota gratuit Firebase : 50 000 lectures par jour pour tout le projet.</div></div>
    <div class="card"><h3>Téléphones abonnés aux alertes</h3><div class="sub">Fiches techniques des notifications (aucune donnée personnelle)</div><table class="tab">
      ${ligne("Total", ap.length)}${ligne("Acceptent les bons plans", promo)}${ligne("Actifs ces 7 derniers jours", actifs7)}${ligne("Mis à jour aujourd'hui", majAuj)}${ligne("Suivis par téléphone (moyenne)", refsMoy)}
    </table><div class="sub" style="margin:8px 0 0">« Suivis » = cartes, commandes ou réservations dont le téléphone reçoit les alertes.</div></div>
    <div class="card"><h3>Connexions admin et caisse</h3><div class="sub">90 derniers jours · ${Object.entries(parApp).map(([k, v]) => esc(k) + " : " + v).join(" · ") || "aucune"}</div>
      <div class="defil"><table class="tab"><tr><th>Date</th><th>Appli</th><th>Appareil</th></tr>${T.connexions.slice(0, 30).map(c => `<tr><td>${hm(c.date)}</td><td>${esc(c.app)}</td><td>${esc(c.appareil)}</td></tr>`).join("") || '<tr><td colspan="3" class="vide">Aucune connexion.</td></tr>'}</table></div></div>
    <div class="card"><h3>Compteurs bruts</h3><div class="sub">Tous les compteurs de la période (${b[0] === b[1] ? b[0] : b[0] + " → " + b[1]}) · ${st.length} fiches</div>
      <div class="defil"><table class="tab"><tr><th>Clé</th><th class="r">Total</th></tr>${lignesBrut.map(([k, v]) => `<tr><td class="mono">${esc(k)}</td><td class="r">${v}</td></tr>`).join("") || '<tr><td colspan="2" class="vide">Aucun compteur.</td></tr>'}</table></div></div>
  </div></div>`;
}

function lignesClients(b) {
  const q = recherche.trim().toLowerCase();
  const l = D.clients.filter(c => !q || [c.nom, c.code, c.tel, c.email].some(v => String(v || "").toLowerCase().includes(q)))
    .sort((x, y) => String(dateDe(y.depuis) || "").localeCompare(String(dateDe(x.depuis) || "")) || String(x.nom || "").localeCompare(String(y.nom || "")));
  const fr = (j) => j ? new Date(j + "T12:00").toLocaleDateString("fr-FR") : "—";
  return `<tr><th>Client</th><th>Carte</th><th>Téléphone</th><th>E-mail</th><th>Anniversaire</th><th>Créée le</th><th class="r">Points</th><th class="r">Tampons</th><th>Dernier tampon</th></tr>` +
    (l.map(c => { const j = dateDe(c.depuis); const tel = String(c.tel || "").replace(/[^\d+]/g, "");
      return `<tr><td>${esc(c.nom || "—")}${dans(j, b) ? '<span class="neuf">nouveau</span>' : ""}</td><td class="mono">${esc(c.code || "")}</td><td>${tel ? `<a href="tel:${esc(tel)}">${esc(c.tel)}</a>` : "—"}</td><td>${c.email ? `<a href="mailto:${esc(c.email)}">${esc(c.email)}</a>` : "—"}</td><td>${esc(c.anniv || "—")}</td><td>${fr(j)}</td><td class="r">${c.points || 0}</td><td class="r">${c.tampons || 0}</td><td>${c.dernierTampon ? hm(c.dernierTampon) : "—"}</td></tr>`; }).join("")
