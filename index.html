<style>
/* Téléphone tourné à l'horizontale : l'appli est prévue en portrait (l'iPhone ne permet pas de bloquer la rotation d'une appli web) */
#portrait{display:none}
@media (orientation:landscape) and (max-height:500px){
  #portrait{display:flex;position:fixed;inset:0;z-index:2147483000;background:#1C433B;color:#fff;flex-direction:column;align-items:center;justify-content:center;gap:12px;text-align:center;padding:20px;font-family:'Nunito',system-ui,sans-serif}
  #portrait .ic{font-size:64px;animation:pt-tourne 2s ease-in-out infinite}
  #portrait b{font-size:22px}
  #portrait span{font-size:14px;opacity:.85}
  body{overflow:hidden}
}
@keyframes pt-tourne{0%,30%{transform:rotate(-90deg)}60%,100%{transform:rotate(0)}}
</style>
<div id="portrait" role="alert"><div class="ic">📱</div><b>Tournez votre téléphone</b><span>L'appli s'utilise à la verticale.</span></div>


<!-- ═══ Ouverture animée « Le verger au lever du jour » (s'affiche tout de suite, pendant que l'appli se charge) ═══ -->
<style>
html.ouv{background:#0D2721}
#ouverture{position:fixed;inset:0;z-index:2147482000;overflow:hidden;font-family:'Nunito',system-ui,sans-serif;-webkit-tap-highlight-color:transparent;
  background:linear-gradient(#0D2721 0%,#1C433B 45%,#3F7A5C 72%,#E8C77A 100%);transition:opacity .6s ease,transform .6s ease}
#ouverture.fin{opacity:0;transform:scale(1.04)}
#ouverture .ov-soleil{position:absolute;left:50%;bottom:-48vw;width:120vw;height:120vw;margin-left:-60vw;border-radius:50%;
  background:radial-gradient(circle,rgba(255,236,170,.85) 0%,rgba(246,212,122,.45) 24%,rgba(246,212,122,0) 58%);transform:translateY(30%);opacity:0;animation:ovLeve 3s ease .1s forwards}
#ouverture .ov-colline{position:absolute;left:-10%;right:-10%;bottom:0;transform:translateY(100%)}
#ouverture .ov-colline svg{display:block;width:100%;height:auto}
#ouverture .ov-c1{animation:ovMonte 1.6s cubic-bezier(.2,.8,.2,1) .2s forwards}
#ouverture .ov-c2{animation:ovMonte 1.6s cubic-bezier(.2,.8,.2,1) .35s forwards}
#ouverture .ov-c3{animation:ovMonte 1.6s cubic-bezier(.2,.8,.2,1) .5s forwards}
#ouverture .ov-pomme{position:absolute;left:50%;top:-60px;width:44px;height:44px;margin-left:-22px;opacity:0;animation:ovTombe .8s cubic-bezier(.55,0,1,.45) 1.1s forwards}
#ouverture .ov-pomme svg{width:100%;height:100%;filter:drop-shadow(0 0 10px rgba(255,220,120,.8))}
#ouverture .ov-onde{position:absolute;left:50%;top:51%;width:60px;height:22px;margin:-11px 0 0 -30px;border:2px solid rgba(255,243,196,.9);border-radius:50%;opacity:0;animation:ovOnde .9s ease-out 1.92s forwards}
#ouverture .ov-logo{position:absolute;left:50%;top:44%;width:min(66vw,280px);transform:translate(-50%,-50%) scale(.2);opacity:0;animation:ovLogo .9s cubic-bezier(.25,1.5,.45,1) 1.9s forwards}
#ouverture .ov-logo img{display:block;width:100%;filter:drop-shadow(0 14px 20px rgba(0,0,0,.35))}
#ouverture .ov-txt{position:absolute;left:0;right:0;top:63%;text-align:center}
#ouverture .ov-slogan{font-family:'Sacramento',cursive;font-size:clamp(32px,9.4vw,42px);line-height:1.05;color:#FFF6DA;text-shadow:0 0 2px rgba(8,30,24,.7),0 2px 14px rgba(8,30,24,.85),0 0 32px rgba(8,30,24,.6);opacity:0;filter:blur(8px);animation:ovNet 1s ease 2.4s forwards}
#ouverture .ov-lieu{margin-top:12px;font-size:10.5px;font-weight:800;letter-spacing:.4em;color:#FFE9A8;text-shadow:0 1px 8px rgba(8,30,24,.9);opacity:0;animation:ovFade .7s ease 2.8s forwards}
#ouverture .ov-luc{position:absolute;width:4px;height:4px;border-radius:50%;background:#FFF3C4;box-shadow:0 0 10px 2px rgba(255,236,170,.8);opacity:0;animation:ovLuciole 3.5s ease-in-out infinite}
@keyframes ovLeve{to{opacity:1;transform:translateY(0)}}
@keyframes ovMonte{to{transform:translateY(0)}}
@keyframes ovTombe{0%{opacity:1;transform:translateY(0) rotate(-40deg)}100%{opacity:1;transform:translateY(calc(51vh + 60px - 22px)) rotate(200deg)}}
@keyframes ovOnde{0%{opacity:1;transform:scale(.4)}100%{opacity:0;transform:scale(5)}}
@keyframes ovLogo{to{opacity:1;transform:translate(-50%,-50%) scale(1)}}
@keyframes ovNet{to{opacity:1;filter:blur(0)}}
@keyframes ovFade{to{opacity:1}}
@keyframes ovLuciole{0%,100%{opacity:0;transform:translate(0,0)}50%{opacity:1;transform:translate(var(--x),-24px)}}

/* ── Habillage Halloween (mémorisé par l'appli : il s'applique dès l'ouverture suivante) ── */
#ouverture .ov-h{display:none}
#ouverture.th-halloween{background:linear-gradient(#0E0718 0%,#1E1030 40%,#3A2252 70%,#8A3E1A 100%)}
#ouverture.th-halloween .ov-h{display:block}
#ouverture.th-halloween .ov-pomme.ov-n{display:none}
#ouverture.th-halloween .ov-soleil{background:radial-gradient(circle,rgba(255,170,80,.9) 0%,rgba(232,115,28,.45) 25%,rgba(232,115,28,0) 60%)}
#ouverture.th-halloween .ov-lune{position:absolute;left:50%;bottom:2vh;width:40vw;max-width:180px;aspect-ratio:1;margin-left:-20vw;border-radius:50%;
  background:radial-gradient(circle at 40% 38%,#FFE3A8,#F7A94A 60%,#D9621A);box-shadow:0 0 60px 20px rgba(255,150,60,.35);transform:translateY(60%);opacity:0;animation:ovLeve 2.6s cubic-bezier(.2,.8,.2,1) .2s forwards}
@media (min-width:460px){#ouverture.th-halloween .ov-lune{margin-left:-90px}}
#ouverture.th-halloween .ov-c1 path{fill:#2A1840}
#ouverture.th-halloween .ov-c2 path{fill:#1E1030}
#ouverture.th-halloween .ov-c3 path{fill:#120A1E}
#ouverture.th-halloween .ov-luc{background:#FFB547;box-shadow:0 0 10px 2px rgba(255,140,40,.8)}
#ouverture.th-halloween .ov-onde{border-color:rgba(255,170,80,.95)}
#ouverture.th-halloween .ov-slogan{color:#FFE7C2;text-shadow:0 0 2px rgba(20,8,30,.8),0 2px 14px rgba(20,8,30,.9),0 0 30px rgba(232,115,28,.45)}
#ouverture.th-halloween .ov-lieu{color:#FFB547}
#ouverture .ov-citrouilles{position:absolute;left:0;right:0;bottom:0;height:16vh;transform:translateY(100%);animation:ovMonte 1.6s cubic-bezier(.2,.8,.2,1) .55s forwards}
#ouverture .ov-citrouilles svg{position:absolute;bottom:2vh;width:13vw;max-width:58px}
#ouverture .ov-citrouilles .yeux{animation:ovLueur 1.6s ease-in-out infinite alternate}
#ouverture .ov-cs{position:absolute;top:18%;left:-80px;animation:ovCS 3.4s ease-in-out .6s forwards}
#ouverture .ov-cs svg{display:block}
#ouverture .ov-cs .aile{transform-box:fill-box;animation:ovAile .2s ease-in-out infinite alternate}
#ouverture .ov-cs .g{transform-origin:100% 60%}#ouverture .ov-cs .d{transform-origin:0% 60%}
#ouverture .ov-brume{position:absolute;left:-30%;right:-30%;bottom:4vh;height:16vh;background:radial-gradient(ellipse at 30% 60%,rgba(210,190,240,.28),transparent 60%),radial-gradient(ellipse at 72% 50%,rgba(210,190,240,.22),transparent 55%);filter:blur(6px);animation:ovBrume 9s linear infinite alternate}
@keyframes ovLueur{0%{opacity:1}100%{opacity:.6}}
@keyframes ovAile{to{transform:scaleY(.25)}}
@keyframes ovCS{0%{transform:translate(0,40px)}100%{transform:translate(calc(100vw + 160px),-60px)}}
@keyframes ovBrume{from{transform:translateX(-6%)}to{transform:translateX(6%)}}

/* ── Habillage Octobre rose ── */
#ouverture .ov-r{display:none}
#ouverture.th-octobrerose{background:linear-gradient(#5E1238 0%,#8E1E50 38%,#D45A8A 72%,#F8BBD0 100%)}
#ouverture.th-octobrerose .ov-r{display:block}
#ouverture.th-octobrerose .ov-pomme.ov-n{display:none}
#ouverture.th-octobrerose .ov-soleil{background:radial-gradient(circle,rgba(255,228,238,.9) 0%,rgba(248,187,208,.5) 25%,rgba(248,187,208,0) 60%)}
#ouverture.th-octobrerose .ov-c1 path{fill:#B24A78}
#ouverture.th-octobrerose .ov-c2 path{fill:#963461}
#ouverture.th-octobrerose .ov-c3 path{fill:#6E1640}
#ouverture.th-octobrerose .ov-luc{background:#FFFFFF;box-shadow:0 0 10px 2px rgba(248,187,208,.9)}
#ouverture.th-octobrerose .ov-onde{border-color:rgba(255,228,238,.95)}
#ouverture.th-octobrerose .ov-slogan{color:#FFF3F7;text-shadow:0 0 2px rgba(70,10,40,.8),0 2px 14px rgba(70,10,40,.85),0 0 30px rgba(236,64,122,.45)}
#ouverture.th-octobrerose .ov-lieu{color:#FFE3EE}
#ouverture.th-octobrerose .ov-logo{width:min(62vw,262px)}
#ouverture .ov-ballon{position:absolute;bottom:-80px;animation:ovBallon 4.5s ease-out forwards}
@keyframes ovBallon{0%{transform:translateY(0) rotate(-6deg);opacity:0}12%{opacity:.95}100%{transform:translate(16px,-110vh) rotate(6deg);opacity:.9}}

/* ── Habillages du lot 2 (Noël, Beaujolais, Saint-Nicolas, Nouvel An) : couleurs posées par le script ── */
#ouverture.th-gen .ov-pomme.ov-n{display:none}
#ouverture .ov-g{display:none}
#ouverture.th-gen .ov-g{display:block}
#ouverture .ov-flocon{position:absolute;top:-12px;width:6px;height:6px;border-radius:50%;background:#fff;box-shadow:0 0 4px rgba(255,255,255,.9);animation:ovNeige linear infinite}
@keyframes ovNeige{to{transform:translate(var(--dx),110vh)}}
#ouverture .ov-feu{position:absolute;width:0;height:0}
#ouverture .ov-feu i{position:absolute;width:3px;height:3px;margin:-1.5px;border-radius:50%;background:var(--c);box-shadow:0 0 6px var(--c);opacity:0;animation:ovFeu 2.2s ease-out infinite;animation-delay:inherit}
@keyframes ovFeu{0%{transform:rotate(var(--a)) translateX(0);opacity:0}6%{opacity:1}40%{transform:rotate(var(--a)) translateX(42px);opacity:.9}60%,100%{transform:rotate(var(--a)) translateX(50px) translateY(8px);opacity:0}}
@media (prefers-reduced-motion:reduce){#ouverture *{animation-duration:.01s!important;animation-delay:0s!important;animation-iteration-count:1!important}#ouverture .ov-luc,#ouverture .ov-pomme,#ouverture .ov-onde,#ouverture .ov-cs{display:none}}
</style>

<script>
  // Ouverture : au moins 3,6 s (ou un toucher), et jamais avant que l'appli soit prête derrière ; ensuite elle s'efface sur l'écran du thème
  (function () {
    var o = document.getElementById("ouverture"), reduit = matchMedia("(prefers-reduced-motion: reduce)").matches;
    document.documentElement.classList.add("ouv");
    try {   // ambiance du thème en cours, mémorisée par l'appli ; après le dernier jour du thème, l'ouverture redevient normale
      var am = JSON.parse(localStorage.getItem("epicerie-raddonnaise-ambiance") || "null"), auj = new Date().toLocaleDateString("sv-SE");
      var LOGOS = { halloween: "logo-halloween.png", noel: "logo-noel.png", octobrerose: "logo-rose.png", beaujolais: "logo-beaujolais.png", stnicolas: "logo-stnicolas.png", nouvelan: "logo-nouvelan.png" };
      if (am && LOGOS[am.id] && (!am.au || auj <= am.au)) {
        if (am.id === "halloween" || am.id === "octobrerose") o.classList.add("th-" + am.id);
        var li = o.querySelector(".ov-logo img"); li.onerror = function () { li.onerror = null; li.src = "logo-intro.png"; }; li.src = LOGOS[am.id];   // la pomme déguisée
      }

      // habillages du lot 2 : ciel, soleil, collines, objet qui tombe, flocons ou feux d'artifice
      var G = {
        noel: { ciel: "linear-gradient(#0A1428 0%,#16294A 45%,#2B4C7E 75%,#9FB6D8 100%)", soleil: "radial-gradient(circle,rgba(255,250,230,.75) 0%,rgba(220,232,250,.35) 25%,transparent 60%)", coll: ["#DCE7F3", "#EEF4FA", "#FFFFFF"], luc: "#FFFFFF", lieu: "#F4D774", neige: 1,
