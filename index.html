  <script>if ("serviceWorker" in navigator) addEventListener("load", () => navigator.serviceWorker.register("sw.js").catch(() => {}));</script>

<body>
<style>
/* Téléphone tourné à l'horizontale : l'appli est prévue en portrait (l'iPhone ne permet pas de bloquer la rotation d'une appli web) */
#portrait{display:none}
@media (orientation:landscape) and (max-height:500px){
  #portrait{display:flex;position:fixed;inset:0;z-index:2147483000;background:#1C433B;color:#fff;flex-direction:column;align-items:center;justify-content:center;gap:12px;text-align:center;padding:20px;font-family:'Nunito',system-ui,sans-serif}
  #portrait .ic{font-size:64px;animation:pt-tourne 2s ease-in-out infinite}
  #portrait b{font-size:22px}
  #portrait span{font-size:14px;opacity:.85}
  body{overflow:hidden}
}
@keyframes pt-tourne{0%,30%{transform:rotate(-90deg)}60%,100%{transform:rotate(0)}}
</style>
<div id="portrait" role="alert"><div class="ic">📱</div><b>Tournez votre téléphone</b><span>L'appli s'utilise à la verticale.</span></div>


<!-- ═══ Ouverture animée (s'affiche tout de suite, pendant que l'appli se charge) ═══ -->
<style>
html.ouv{background:#10302A}
#ouverture{position:fixed;inset:0;z-index:2147482000;display:flex;flex-direction:column;align-items:center;justify-content:center;overflow:hidden;
  background:radial-gradient(circle at 50% 42%,#2B6352 0%,#1C433B 38%,#0E2A24 100%);font-family:'Nunito',system-ui,sans-serif;-webkit-tap-highlight-color:transparent;
  clip-path:circle(150% at 50% 42%);transition:clip-path .7s cubic-bezier(.7,0,.3,1),opacity .7s ease}
#ouverture.fin{clip-path:circle(0% at 50% 42%);opacity:.6}
#ouverture .ov-scene{position:relative;width:min(78vw,330px);aspect-ratio:1;display:flex;align-items:center;justify-content:center;margin-top:-6vh}
#ouverture .ov-glow{position:absolute;inset:-18%;border-radius:50%;background:radial-gradient(circle,rgba(246,212,122,.45) 0%,rgba(246,212,122,.12) 35%,transparent 65%);opacity:0;animation:ovGlow 2.6s ease .25s forwards}
#ouverture .ov-rayons{position:absolute;inset:-40%;background:repeating-conic-gradient(from 0deg,rgba(255,243,196,.10) 0deg 6deg,transparent 6deg 18deg);border-radius:50%;
  -webkit-mask:radial-gradient(circle,#000 20%,transparent 62%);mask:radial-gradient(circle,#000 20%,transparent 62%);opacity:0;animation:ovRayons 6s linear .5s forwards}
#ouverture svg.ov-anneau{position:absolute;inset:0;width:100%;height:100%;transform:rotate(-90deg)}
#ouverture .ov-anneau circle{fill:none;stroke:url(#ovOr);stroke-width:2.2;stroke-linecap:round;stroke-dasharray:302;stroke-dashoffset:302;animation:ovTrace 1s cubic-bezier(.6,0,.2,1) .1s forwards}
#ouverture .ov-anneau circle.c2{stroke-width:.8;opacity:.5;stroke-dasharray:4 6;stroke-dashoffset:0;animation:ovTourne 9s linear infinite;transform-origin:50% 50%}
#ouverture .ov-logo{position:relative;width:74%;opacity:0;transform:scale(.2) rotate(-12deg);animation:ovPop 1s cubic-bezier(.25,1.55,.45,1) .45s forwards,ovFlotte 3s ease-in-out 1.6s infinite}
#ouverture .ov-logo img{display:block;width:100%;height:auto;filter:drop-shadow(0 14px 22px rgba(0,0,0,.35))}
#ouverture .ov-brille{position:absolute;inset:0;-webkit-mask:url(logo-intro.png) center/100% auto no-repeat;mask:url(logo-intro.png) center/100% auto no-repeat;
  background:linear-gradient(105deg,transparent 35%,rgba(255,255,255,.85) 48%,rgba(255,250,220,.9) 50%,transparent 62%);background-size:300% 100%;background-position:120% 0;animation:ovBrille 1.1s ease 1.25s forwards}
#ouverture .ov-p{position:absolute;left:50%;top:50%;width:var(--t);height:var(--t);margin:calc(var(--t)/-2);opacity:0;animation:ovEclat 1.3s cubic-bezier(.15,.7,.3,1) var(--d) forwards}
#ouverture .ov-p.f{background:#A9C75A;border-radius:0 70% 0 70%}
#ouverture .ov-p.o{background:#FFE9A8;border-radius:50%;box-shadow:0 0 8px #F6D47A}
#ouverture .ov-txt{position:relative;text-align:center;margin-top:2.5vh}
#ouverture .ov-slogan{font-family:'Sacramento',cursive;font-size:clamp(30px,9vw,40px);line-height:1.1;background:linear-gradient(100deg,#E9B949,#FFF3C4 45%,#F6D47A 60%,#C9971C);
  -webkit-background-clip:text;background-clip:text;color:transparent;clip-path:inset(0 100% 0 0);animation:ovEcrit 1s ease 1.15s forwards;padding:0 10px}
#ouverture .ov-lieu{margin-top:10px;font-size:11px;font-weight:800;letter-spacing:4px;text-transform:uppercase;color:rgba(255,243,196,.75);opacity:0;animation:ovMonte .7s ease 1.7s forwards}
@keyframes ovTrace{to{stroke-dashoffset:0}}
@keyframes ovTourne{to{transform:rotate(360deg)}}
@keyframes ovGlow{0%{opacity:0;transform:scale(.6)}40%{opacity:1;transform:scale(1.05)}100%{opacity:.75;transform:scale(1)}}
@keyframes ovRayons{0%{opacity:0;transform:rotate(0)}20%{opacity:1}100%{opacity:.8;transform:rotate(60deg)}}
@keyframes ovPop{0%{opacity:0;transform:scale(.2) rotate(-12deg)}60%{opacity:1}100%{opacity:1;transform:scale(1) rotate(0)}}
@keyframes ovFlotte{0%,100%{translate:0 0}50%{translate:0 -6px}}
@keyframes ovBrille{to{background-position:-60% 0}}
@keyframes ovEclat{0%{opacity:0;transform:translate(0,0) scale(.3) rotate(0)}15%{opacity:1}100%{opacity:0;transform:translate(var(--x),var(--y)) scale(1) rotate(var(--r))}}
@keyframes ovEcrit{to{clip-path:inset(0 0 0 0)}}
@keyframes ovMonte{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){#ouverture *{animation-duration:.01s!important;animation-delay:0s!important}#ouverture .ov-p,#ouverture .ov-rayons{display:none}}
</style>
<div id="ouverture" aria-label="Épicerie Raddonnaise">
  <div class="ov-scene">
    <div class="ov-rayons"></div><div class="ov-glow"></div>
    <svg class="ov-anneau" viewBox="0 0 100 100" aria-hidden="true"><defs><linearGradient id="ovOr" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#FFF3C4"/><stop offset=".5" stop-color="#E9B949"/><stop offset="1" stop-color="#B8860B"/></linearGradient></defs>
      <circle cx="50" cy="50" r="48"/><circle class="c2" cx="50" cy="50" r="45"/></svg>
    <div class="ov-logo"><img src="logo-intro.png" alt="Épicerie Raddonnaise"><div class="ov-brille"></div></div>
  </div>
  <div class="ov-txt"><div class="ov-slogan">Épicerie locale &amp; familiale</div><div class="ov-lieu">Raddon-et-Chapendu</div></div>
</div>
<script>
  // Ouverture : au moins 2,4 s (ou un toucher), et jamais avant que l'appli soit prête derrière ; ensuite le cercle se referme sur l'écran du thème
  (function () {
    var o = document.getElementById("ouverture"), reduit = matchMedia("(prefers-reduced-motion: reduce)").matches;
    document.documentElement.classList.add("ouv");
    var sc = o.querySelector(".ov-scene");
    for (var i = 0; i < 26; i++) {   // éclats de feuilles et d'étincelles dorées
      var p = document.createElement("i"), a = Math.random() * Math.PI * 2, r = 120 + Math.random() * 120;
      p.className = "ov-p " + (i % 2 ? "f" : "o");
      p.style.cssText = "--x:" + Math.cos(a) * r + "px;--y:" + Math.sin(a) * r + "px;--r:" + (Math.random() * 360 - 180) + "deg;--t:" + (i % 2 ? 9 + Math.random() * 7 : 4 + Math.random() * 4) + "px;--d:" + (.75 + Math.random() * .35) + "s";
      sc.appendChild(p);
    }
    var t0 = Date.now(), min = reduit ? 500 : 2400, pret = false, touche = false, fini = false;
    function essayer() {
      if (fini || !pret || (!touche && Date.now() - t0 < min)) return;
      fini = true; o.classList.add("fin"); o.style.pointerEvents = "none";
      window.__ouvFinie = true; dispatchEvent(new Event("ouverture-fin"));   // l'écran du thème démarre derrière le cercle qui se referme
      setTimeout(function () { o.remove(); document.documentElement.classList.remove("ouv"); }, 750);
    }
    window.__appPret = function () { pret = true; essayer(); };
    o.addEventListener("click", function () { touche = true; essayer(); });
    setTimeout(essayer, min + 20);
    setTimeout(function () { pret = true; essayer(); }, 9000);   // filet de sécurité : l'ouverture ne bloque jamais l'appli
  })();
</script>
  <div id="root"></div>
  <noscript>Activez JavaScript pour utiliser l'application.</noscript>
  <script>
    // Filet de sécurité : si l'appli ne s'affiche pas (mise à jour coupée, réseau…), on propose de recharger
    (function () {
      function secours() {
        var r = document.getElementById("root"); if (!r || r.childElementCount) return;
        window.__appPret && window.__appPret();   // l'ouverture animée laisse la place au bouton « Recharger »
        r.innerHTML = '<div style="font-family:system-ui,sans-serif;text-align:center;padding:60px 24px;color:#1C433B">'
          + '<div style="font-size:19px;font-weight:800;margin-bottom:8px">Chargement…</div>'
          + '<div style="font-size:14px;color:#5C6A62;margin-bottom:20px">L\'application met un peu de temps à démarrer.</div>'
          + '<button onclick="location.reload()" style="border:none;background:#1C433B;color:#fff;font-size:16px;font-weight:800;padding:14px 26px;border-radius:12px">Recharger</button></div>';
      }
      window.__secours = secours;
      setTimeout(secours, 7000);
    })();
  </script>
  <script type="module" src="client.js?v=2.21" onerror="window.__secours && window.__secours()"></script>
</body>
</html>
